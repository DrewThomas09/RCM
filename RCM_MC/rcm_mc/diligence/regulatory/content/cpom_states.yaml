# Corporate Practice of Medicine state lattice.
#
# ⚠ PARTIALLY RE-VERIFIED 2026-08-03 — DO NOT TREAT AS CURATED. See MR1075.
#
# A primary-source review of all 41 claims in this file found 13 WRONG,
# 4 STALE and 10 UNVERIFIABLE. The 60-day freshness lock had been failing
# since ~2026-06-22 and it was RIGHT to: the problem turned out to be
# content accuracy, not an expired timestamp.
#
# Two entries cited statutes that do not say what the entry says:
#   · WA "HB 2548 (2024)" — no such bill exists. The Washington
#     Legislature's own database returns "Bill 2548 for the 2023-2024
#     biennium was not found." Independently confirmed 2026-08-03.
#   · NY "S8157" — is the "NYS health care tax reform act", a surcharge
#     bill with no CPOM, MSO or ownership content whatsoever.
#     Independently confirmed 2026-08-03.
# Both are corrected below. A cited authority that does not exist is worse
# than no citation, because it survives review by looking checked.
#
# `last_reviewed` is deliberately NOT bumped. Connecticut and Indiana still
# have open primary-source gaps (see their entries), and stamping the file
# would convert those known-unknowns into unknown-unknowns. The lock stays
# red until a human closes them.
#
# Seeded from the PESP tracker + state bill texts as of 2026-04.
# Every entry MUST carry source_urls and last_reviewed. The
# regulatory content-freshness test fails any entry older than
# 60 days — this is the forcing function for curation cadence.
#
# Fields per state:
#   code              — 2-letter USPS
#   name              — state name
#   statute           — primary cite
#   effective_date    — ISO (null if not yet law)
#   compliance_deadline — ISO (null if none)
#   structure_bans    — list of legal structures that are banned
#                       outright (void ab initio). Choose from:
#                       FRIENDLY_PC_PASS_THROUGH, MSO_PC_MANAGEMENT_FEE,
#                       DIRECT_EMPLOYMENT, PROFESSIONAL_LLC
#   structure_restrictions — list of structures subject to conditions
#   voided_contracts  — specific contract kinds that may be void
#   remediation_cost_usd — rough legal + restructuring estimate
#   last_reviewed     — ISO
#   source_urls       — list of public URLs
#
# "structure_bans" is the hard criterion that flips the composite
# score to RED. "structure_restrictions" triggers YELLOW.

